[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vegas-signal-system"
version = "0.1.0"
description = "Configurable Vegas-style market signal scanner; signal-only, no order execution."
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<3.0", "PyYAML>=6.0,<7.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]
market-data = ["yfinance>=0.2.60,<1.0"]

[project.scripts]
vegas-scan = "vegas_signal_system.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
