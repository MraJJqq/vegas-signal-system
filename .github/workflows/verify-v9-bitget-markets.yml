name: Verify V9 Bitget Contracts and Live Tickers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v9-markets:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m py_compile v9/verify_bitget_markets.py

      - name: Check all 19 contracts and fresh tickers (read-only)
        run: python v9/verify_bitget_markets.py
