name: V9 Unit Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "v9/**"
      - "tests/**"
      - ".github/workflows/v9-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q v9 tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
