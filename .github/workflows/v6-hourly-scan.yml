name: V6 Hourly Market Scan
on:
  workflow_dispatch:
  schedule:
    # Hourly integer time; UTC whole hours align with Beijing whole hours.
    - cron: "0 * * * *"
  push:
    branches: [main]
    paths:
      - "v6/**"
      - ".github/workflows/v6-hourly-scan.yml"
permissions:
  contents: read
concurrency:
  group: v6-hourly-scan
  cancel-in-progress: false
jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test V6 modules
        run: python -m unittest discover -s v6 -p "test_*.py" -v
      - name: Run V6 scan and send ntfy digest
        env:
          PYTHONPATH: v6
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_BASE_URL: ${{ vars.NTFY_BASE_URL }}
        run: |
          set -o pipefail
          if [ -z "$NTFY_TOPIC" ]; then echo "::error::Repository secret NTFY_TOPIC is not configured."; exit 1; fi
          python v6/run_v6_hourly.py --limit 1000 --workers 4 --state .state/v6_notifications.json