name: VEGAS V9 A股 Baostock 50-Stock Data Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v9-cn-a-baostock-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Baostock
        run: python -m pip install --upgrade pip baostock
      - name: Validate test script
        run: python -m py_compile v9_cn_a/baostock_test.py
      - name: Run 50-stock Baostock data test
        run: python v9_cn_a/baostock_test.py
      - name: Upload Baostock test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vegas-v9-cn-a-baostock-50-stock-report
          path: v9_cn_a/baostock-test-report.json
          if-no-files-found: warn
          retention-days: 14
