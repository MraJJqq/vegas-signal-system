name: Vegas V4 Hourly Market Scan

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/v4-hourly-scan.yml"
      - "v4/**"

permissions:
  contents: read

concurrency:
  group: vegas-v4-hourly-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      V4_SYMBOLS: 'SPYUSDT,QQQUSDT,SNDKUSDT,NVDAUSDT,AMDUSDT,AVGOUSDT,MUUSDT,TSMUSDT,MSFTUSDT,AAPLUSDT,TSLAUSDT,ARMUSDT,AMZNUSDT,METAUSDT,GOOGLUSDT,ORCLUSDT,PLTRUSDT,COINUSDT,MSTRUSDT,HOODUSDT,XAUUSDT,CLUSDT,BTCUSDT,HYPEUSDT'
      V4_TIMEZONE: ${{ vars.V4_TIMEZONE || 'Asia/Shanghai' }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      V4_STATE_FILE: v4-state/notifications.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore same-day digest state
        uses: actions/cache/restore@v4
        with:
          path: v4-state
          key: vegas-v4-digest-${{ github.run_id }}
          restore-keys: |
            vegas-v4-digest-
      - name: Validate ntfy configuration
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::error::Repository secret NTFY_TOPIC is missing."
            exit 1
          fi
      - name: Run V4 scan and send daily digest
        working-directory: v4
        run: python run_v4_hourly.py --state ../v4-state/notifications.json --timezone "$V4_TIMEZONE"
      - name: Save same-day digest state
        if: always() && hashFiles('v4-state/notifications.json') != ''
        uses: actions/cache/save@v4
        with:
          path: v4-state
          key: vegas-v4-digest-${{ github.run_id }}
