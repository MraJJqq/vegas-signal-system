name: V3 A-share data-source validation

on:
  workflow_dispatch:
  push:
    paths:
      - "v3_a_shares/**"
      - ".github/workflows/ashare-data-validation.yml"

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip akshare pandas
      - name: Run offline unit tests
        working-directory: v3_a_shares
        run: python -m unittest -v

  live-data-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip akshare pandas
      - name: Probe live A-share snapshot and 60-minute qfq history
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          from datetime import datetime
          import akshare as ak

          print("LIVE_TEST=START")
          spot = ak.stock_zh_a_spot_em()
          print(f"SNAPSHOT_ROWS={len(spot)}")
          print(f"SNAPSHOT_COLUMNS={list(spot.columns)}")
          if not {"代码", "名称", "最新价"}.issubset(spot.columns):
              raise SystemExit("FAIL: snapshot schema missing required columns")
          sample = spot.loc[spot["代码"].astype(str).str.zfill(6) == "000001"]
          if sample.empty:
              raise SystemExit("FAIL: sample stock 000001 not found in live snapshot")
          print("SAMPLE_STOCK=" + str(sample.iloc[0]["名称"]))
          print("SAMPLE_LAST_PRICE=" + str(sample.iloc[0]["最新价"]))

          end = datetime.now().strftime("%Y-%m-%d %H:%M:%S")
          history = ak.stock_zh_a_hist_min_em(
              symbol="000001",
              start_date="2018-01-01 09:30:00",
              end_date=end,
              period="60",
              adjust="qfq",
          )
          print(f"HISTORY_ROWS={len(history)}")
          print(f"HISTORY_COLUMNS={list(history.columns)}")
          if history.empty:
              raise SystemExit("FAIL: provider returned empty 60-minute qfq history")
          if "时间" in history.columns:
              times = history["时间"].astype(str)
              print(f"HISTORY_FIRST={times.iloc[0]}")
              print(f"HISTORY_LAST={times.iloc[-1]}")
          print("ADJUSTMENT_REQUEST=qfq")
          print("LIVE_TEST=PASS")
          PY
