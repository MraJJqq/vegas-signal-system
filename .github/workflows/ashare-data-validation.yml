name: V3 A-share data-source validation

on:
  workflow_dispatch:
  push:
    paths:
      - "v3_a_shares/**"
      - ".github/workflows/ashare-data-validation.yml"

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip baostock pandas
      - name: Run offline unit tests
        working-directory: v3_a_shares
        run: python -m unittest -v

  live-data-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip baostock pandas
      - name: Probe BaoStock historical 60-minute qfq data
        env:
          PYTHONUNBUFFERED: "1"
        working-directory: v3_a_shares
        run: |
          python - <<'PY'
          from akshare_market_data import fetch_symbol_4h_history
          print("LIVE_TEST=START")
          bars = fetch_symbol_4h_history("000001", start_date="20180101")
          print(f"SYMBOL=000001")
          print(f"COMPLETE_SESSION_BARS={len(bars)}")
          print(f"FIRST_SESSION={bars[0].session_date}")
          print(f"LAST_SESSION={bars[-1].session_date}")
          print("ADJUSTMENT_REQUEST=forward_adjusted")
          print("LIVE_TEST=PASS")
          PY
