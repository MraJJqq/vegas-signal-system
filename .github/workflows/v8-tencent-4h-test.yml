name: V8 Tencent Native 4H Data Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-tencent-4h:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test native Tencent 4H candles
        run: python v8/tencent_4h_test.py
