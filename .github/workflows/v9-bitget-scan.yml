name: VEGAS V9 Bitget Scan

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v9-bitget-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax and tests
        run: |
          python -m compileall -q v9 tests
          python -m unittest discover -s tests -v
      - name: Scan Bitget USDT futures
        id: scan
        env:
          V9_REPORT_PATH: v9/scan-report.json
        run: python v9/bitget_scanner.py
      - name: Persist V9 state to repository
        if: always()
        run: |
          if [ ! -f v9/.signal-state.json ]; then
            echo "No V9 state file produced; nothing to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f v9/.signal-state.json
          if git diff --cached --quiet; then
            echo "V9 state unchanged; no commit required."
            exit 0
          fi
          git commit -m "chore(v9): persist signal state"
          git push
      - name: Send V9 Bark notification
        if: success()
        env:
          V9_BARK_KEY: ${{ secrets.V9_BARK_KEY }}
        run: python v9/ntfy_notifier.py v9/scan-report.json
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vegas-v9-bitget-scan-report
          path: v9/scan-report.json
          if-no-files-found: warn
          retention-days: 7
