name: VEGAS V9 Bitget Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v9-bitget-scan.yml"
      - "v9/ntfy_notifier.py"
      - "v9/bitget_scanner.py"
      - "v9/vegas_signals.py"
      - "tests/test_v9_notifier.py"
      - "tests/test_v9_scanner.py"
      - "tests/test_v9_signals.py"
  schedule:
    # Beijing time 09:00–21:00 every two hours; GitHub cron uses UTC.
    - cron: "0 1,3,5,7,9,11,13 * * *"

permissions:
  contents: write

concurrency:
  group: v9-bitget-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore 4H candle cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/v9-candles
          key: v9-candle-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            v9-candle-cache-
      - name: Validate Python syntax and tests
        run: |
          python -m compileall -q v9 tests
          python -m unittest discover -s tests -v
      - name: Scan Bitget USDT futures
        id: scan
        env:
          V9_REPORT_PATH: v9/scan-report.json
        run: python v9/bitget_scanner.py
      - name: Save refreshed 4H candle cache
        if: ${{ always() && steps.scan.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/v9-candles
          key: v9-candle-cache-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Persist V9 state to repository
        if: ${{ always() && steps.scan.outcome == 'success' }}
        run: |
          if [ ! -f v9/.signal-state.json ]; then
            echo "No V9 state file produced; nothing to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f v9/.signal-state.json
          if git diff --cached --quiet; then
            echo "V9 state unchanged; no commit required."
            exit 0
          fi
          git commit -m "chore(v9): persist signal state"
          branch="${GITHUB_REF_NAME}"
          # Rebase on the latest remote commit before pushing. If another
          # commit also changed the state file, keep this run's freshly
          # generated state while preserving all unrelated remote changes.
          git fetch origin "$branch"
          if ! git rebase "origin/$branch"; then
            if git status --porcelain | grep -q 'v9/\.signal-state\.json'; then
              git checkout --theirs -- v9/.signal-state.json
              git add -f v9/.signal-state.json
              GIT_EDITOR=true git rebase --continue
            else
              git rebase --abort
              exit 1
            fi
          fi
          for attempt in 1 2 3; do
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            echo "Push attempt $attempt failed; refreshing remote and retrying."
            git fetch origin "$branch"
            if ! git rebase "origin/$branch"; then
              if git status --porcelain | grep -q 'v9/\.signal-state\.json'; then
                git checkout --theirs -- v9/.signal-state.json
                git add -f v9/.signal-state.json
                GIT_EDITOR=true git rebase --continue
              else
                git rebase --abort
                exit 1
              fi
            fi
          done
          echo "Unable to push V9 state after 3 attempts."
          exit 1
      - name: Send V9 Bark notification
        id: bark
        if: ${{ always() && steps.scan.outcome == 'success' }}
        env:
          V9_BARK_KEY: ${{ secrets.V9_BARK_KEY }}
          V9_NOTIFICATION_TEST_MODE: "0"
          V9_PUBLIC_SIGNAL_PATH: /tmp/v9-bark-signals.json
        run: python v9/ntfy_notifier.py v9/scan-report.json
      - name: Persist Bark notification state
        if: ${{ always() && steps.bark.outcome == 'success' && hashFiles('v9/.bark-notification-state.json') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f v9/.bark-notification-state.json
          if git diff --cached --quiet; then
            echo "Bark notification state unchanged; no commit required."
            exit 0
          fi
          git commit -m "chore(v9): persist Bark notification state"
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            git fetch origin "$branch"
            if ! git rebase "origin/$branch"; then
              if git status --porcelain | grep -q 'v9/\.bark-notification-state\.json'; then
                git checkout --theirs -- v9/.bark-notification-state.json
                git add -f v9/.bark-notification-state.json
                GIT_EDITOR=true git rebase --continue
              else
                git rebase --abort
                exit 1
              fi
            fi
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            echo "Bark state push attempt $attempt failed; refreshing remote and retrying."
          done
          echo "Unable to persist Bark notification state after 3 attempts."
          exit 1
      - name: Publish sanitized signal state to Vegas Octopus V2
        if: ${{ always() && steps.scan.outcome == 'success' && steps.bark.outcome == 'success' }}
        env:
          OCTOPUS_REPO_TOKEN: ${{ secrets.OCTOPUS_REPO_TOKEN }}
        run: |
          if [ -z "${OCTOPUS_REPO_TOKEN}" ]; then
            echo "::error::OCTOPUS_REPO_TOKEN is missing; cannot publish V9 signals to Vegas Octopus V2."
            exit 1
          fi
          if [ ! -f /tmp/v9-bark-signals.json ]; then
            echo "::error::Bark-aligned signal manifest is missing."
            exit 1
          fi
          git clone --depth 1 https://github.com/MraJJqq/vegas-octopus-v2.git /tmp/octopus-v2
          cp /tmp/v9-bark-signals.json /tmp/octopus-v2/v9-signals.json
          cd /tmp/octopus-v2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v9-signals.json
          if git diff --cached --quiet; then
            echo "Public signal mirror unchanged."
          else
            git commit -m "chore: update public V9 signal mirror"
            credentials_file=/tmp/octopus-git-credentials
            printf 'https://x-access-token:%s@github.com\n' "$OCTOPUS_REPO_TOKEN" > "$credentials_file"
            chmod 600 "$credentials_file"
            git config credential.helper "store --file=$credentials_file"
            git push origin HEAD:main
            rm -f "$credentials_file"
          fi
      - name: Upload scan report
        if: ${{ always() && steps.scan.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: vegas-v9-bitget-scan-report
          path: v9/scan-report.json
          if-no-files-found: warn
          retention-days: 7
