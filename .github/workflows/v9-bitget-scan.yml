name: VEGAS V9 Bitget Scan

on:
  schedule:
    # Beijing time 10:00–22:00 every two hours; GitHub cron uses UTC.
    - cron: "0 2,4,6,8,10,12,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v9-bitget-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax and tests
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          python -m compileall -q v9 tests
          python -m unittest discover -s tests -v
      - name: Scan Bitget USDT futures
        if: ${{ github.event_name != 'workflow_dispatch' }}
        id: scan
        env:
          V9_REPORT_PATH: v9/scan-report.json
        run: python v9/bitget_scanner.py
      - name: Persist V9 state to repository
        if: ${{ always() && github.event_name != 'workflow_dispatch' }}
        run: |
          if [ ! -f v9/.signal-state.json ]; then
            echo "No V9 state file produced; nothing to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f v9/.signal-state.json
          if git diff --cached --quiet; then
            echo "V9 state unchanged; no commit required."
            exit 0
          fi
          git commit -m "chore(v9): persist signal state"
          branch="${GITHUB_REF_NAME}"
          # Rebase on the latest remote commit before pushing. If another
          # commit also changed the state file, keep this run's freshly
          # generated state while preserving all unrelated remote changes.
          git fetch origin "$branch"
          if ! git rebase "origin/$branch"; then
            if git status --porcelain | grep -q 'v9/\.signal-state\.json'; then
              git checkout --theirs -- v9/.signal-state.json
              git add -f v9/.signal-state.json
              GIT_EDITOR=true git rebase --continue
            else
              git rebase --abort
              exit 1
            fi
          fi
          for attempt in 1 2 3; do
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            echo "Push attempt $attempt failed; refreshing remote and retrying."
            git fetch origin "$branch"
            if ! git rebase "origin/$branch"; then
              if git status --porcelain | grep -q 'v9/\.signal-state\.json'; then
                git checkout --theirs -- v9/.signal-state.json
                git add -f v9/.signal-state.json
                GIT_EDITOR=true git rebase --continue
              else
                git rebase --abort
                exit 1
              fi
            fi
          done
          echo "Unable to push V9 state after 3 attempts."
          exit 1
      - name: Publish sanitized signal state to Vegas Octopus V2
        if: ${{ success() && github.event_name != 'workflow_dispatch' }}
        env:
          OCTOPUS_REPO_TOKEN: ${{ secrets.OCTOPUS_REPO_TOKEN }}
        run: |
          if [ -z "${OCTOPUS_REPO_TOKEN}" ]; then
            echo "::error::OCTOPUS_REPO_TOKEN is missing; cannot publish V9 signals to Vegas Octopus V2."
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path("v9/.signal-state.json").read_text(encoding="utf-8"))
          daily = state.get("__daily_formal_signals__", {})
          public_state = {
              "__daily_formal_signals__": {
                  "date": daily.get("date"),
                  "signals": [
                      {"symbol": item.get("symbol"), "timeframe": item.get("timeframe"), "formal_signal": True}
                      for item in daily.get("signals", [])
                      if isinstance(item, dict) and item.get("formal_signal") is True
                  ]
              }
          }
          Path("/tmp/v9-signals.json").write_text(json.dumps(public_state, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
          git clone --depth 1 https://github.com/MraJJqq/vegas-octopus-v2.git /tmp/octopus-v2
          cp /tmp/v9-signals.json /tmp/octopus-v2/v9-signals.json
          cd /tmp/octopus-v2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v9-signals.json
          if git diff --cached --quiet; then
            echo "Public signal mirror unchanged."
          else
            git commit -m "chore: update public V9 signal mirror"
            credentials_file=/tmp/octopus-git-credentials
            printf 'https://x-access-token:%s@github.com\n' "$OCTOPUS_REPO_TOKEN" > "$credentials_file"
            chmod 600 "$credentials_file"
            git config credential.helper "store --file=$credentials_file"
            git push origin HEAD:main
            rm -f "$credentials_file"
          fi
      - name: Send V9 Bark notification
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || steps.scan.outcome == 'success') }}
        env:
          V9_BARK_KEY: ${{ secrets.V9_BARK_KEY }}
          V9_NOTIFICATION_TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            printf '{"signals":[]}' > /tmp/v9-bark-test-report.json
            python v9/ntfy_notifier.py /tmp/v9-bark-test-report.json
          else
            python v9/ntfy_notifier.py v9/scan-report.json
          fi
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vegas-v9-bitget-scan-report
          path: v9/scan-report.json
          if-no-files-found: warn
          retention-days: 7
