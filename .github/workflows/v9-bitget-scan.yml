name: VEGAS V9 Bitget Scan

on:
  schedule:
    # Beijing time 07:00–22:00 inclusive; GitHub cron uses UTC.
    - cron: "0 0-14,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v9-bitget-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax and tests
        run: |
          python -m compileall -q v9 tests
          python -m unittest discover -s tests -v
      - name: Scan Bitget USDT futures
        id: scan
        env:
          V9_REPORT_PATH: v9/scan-report.json
        run: python v9/bitget_scanner.py
      - name: Persist V9 state to repository
        if: always()
        run: |
          if [ ! -f v9/.signal-state.json ]; then
            echo "No V9 state file produced; nothing to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f v9/.signal-state.json
          if git diff --cached --quiet; then
            echo "V9 state unchanged; no commit required."
            exit 0
          fi
          git commit -m "chore(v9): persist signal state"
          git push
      - name: Sync sanitized V9 signals to Vegas Octopus
        if: success()
        env:
          OCTOPUS_SYNC_TOKEN: ${{ secrets.OCTOPUS_SYNC_TOKEN }}
        run: |
          if [ -z "$OCTOPUS_SYNC_TOKEN" ]; then
            echo "OCTOPUS_SYNC_TOKEN is not configured; signal sync skipped safely."
            exit 0
          fi
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          source = json.loads(Path("v9/.signal-state.json").read_text(encoding="utf-8"))
          daily = source.get("__daily_formal_signals__", {})
          signals = daily.get("signals", []) if isinstance(daily, dict) else []
          safe = {
              "connected": True,
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "signal_date": daily.get("date") if isinstance(daily, dict) else None,
              "signals": [
                  {k: s.get(k) for k in ("formal_signal", "symbol", "timeframe", "line",
                    "filter_line", "filter_side", "close_price", "candle_timestamp_ms")}
                  for s in signals if isinstance(s, dict) and s.get("formal_signal") is True
              ]
          }
          Path("/tmp/octopus-signal-state.json").write_text(
              json.dumps(safe, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git clone "https://x-access-token:${OCTOPUS_SYNC_TOKEN}@github.com/MraJJqq/vegas-octopus.git" /tmp/vegas-octopus
          cp /tmp/octopus-signal-state.json /tmp/vegas-octopus/web/signal-state.json
          cd /tmp/vegas-octopus
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/signal-state.json
          if git diff --cached --quiet; then
            echo "Signal payload unchanged."
            exit 0
          fi
          git commit -m "chore: sync read-only V9 signals"
          git push
      - name: Send V9 Bark notification
        if: success()
        env:
          V9_BARK_KEY: ${{ secrets.V9_BARK_KEY }}
        run: python v9/ntfy_notifier.py v9/scan-report.json
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vegas-v9-bitget-scan-report
          path: v9/scan-report.json
          if-no-files-found: warn
          retention-days: 7
