name: V8 AKShare A-share Data Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-akshare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AKShare
        run: python -m pip install --upgrade pip akshare

      - name: Test real A-share historical data
        run: python v8/akshare_test.py
