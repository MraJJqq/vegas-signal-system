name: Temporary V9 2H Regression Check

on:
  push:
    paths:
      - ".github/workflows/test-v9-2h.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and run V9 tests
        run: |
          python -m compileall -q v9 tests
          python -m unittest discover -s tests -v
          python -m unittest discover -s v9 -p 'test*.py' -v
