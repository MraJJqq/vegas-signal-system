name: Temporary V9 2H Regression Check

on:
  push:
    paths:
      - ".github/workflows/test-v9-2h.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and run V9 tests
        run: |
          python -m compileall -q v9 tests
          python -m unittest discover -s tests -v
          PYTHONPATH=v9 python -c "from test_vegas_signals_regression import test_middle_of_band_counts_as_touch_even_when_no_single_ema_is_crossed, test_candle_outside_both_bands_does_not_touch, test_touch_at_band_boundary_counts_as_overlap; test_middle_of_band_counts_as_touch_even_when_no_single_ema_is_crossed(); test_candle_outside_both_bands_does_not_touch(); test_touch_at_band_boundary_counts_as_overlap(); print('3 V9 zone regression checks passed')"
