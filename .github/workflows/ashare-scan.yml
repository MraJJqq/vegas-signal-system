name: Vegas A-share Scan

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/ashare_scan.py"
      - ".github/workflows/ashare-scan.yml"
      - "pyproject.toml"
  schedule:
    - cron: "25 * * * 1-5"

permissions:
  contents: read

jobs:
  ashare-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install Vegas scanner and A-share data adapter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "akshare>=1.16"
      - name: Run A-share Vegas scan
        run: python scripts/ashare_scan.py | tee ashare-scan-log.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vegas-ashare-scan-${{ github.run_id }}
          path: |
            output/ashare/
            ashare-scan-log.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Notify scan completion via ntfy
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_BASE_URL: ${{ vars.NTFY_BASE_URL || 'https://ntfy.sh' }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -c 'import json,os,urllib.request; t=os.environ.get("NTFY_TOPIC","").strip(); b=os.environ.get("NTFY_BASE_URL","https://ntfy.sh").rstrip("/"); s=os.environ.get("JOB_STATUS","unknown"); u=os.environ.get("RUN_URL",""); p=json.dumps({"topic":t,"title":"Vegas A股扫描完成" if s=="success" else "Vegas A股扫描异常","message":f"任务状态：{s}\n运行详情：{u}"},ensure_ascii=False).encode(); r=urllib.request.Request(b,data=p,headers={"Content-Type":"application/json; charset=utf-8"},method="POST"); urllib.request.urlopen(r,timeout=15).read() if t else print("NTFY_TOPIC missing; notification skipped")'

      - name: Notify scan completion via ntfy
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_BASE_URL: ${{ vars.NTFY_BASE_URL || 'https://ntfy.sh' }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          topic = os.environ.get("NTFY_TOPIC", "").strip()
          if not topic:
              print("NTFY_TOPIC is not configured; completion notification skipped.")
              raise SystemExit(0)
          status = os.environ.get("JOB_STATUS", "unknown")
          title = "Vegas A股扫描完成" if status == "success" else "Vegas A股扫描异常"
          message = f"任务状态：{status}\n查看运行详情：{os.environ.get('RUN_URL', '')}"
          base = os.environ.get("NTFY_BASE_URL", "https://ntfy.sh").rstrip("/")
          payload = json.dumps({"topic": topic, "title": title, "message": message}, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(base, data=payload, headers={"Content-Type": "application/json; charset=utf-8"}, method="POST")
          with urllib.request.urlopen(req, timeout=15) as response:
              print(f"ntfy completion notification accepted: HTTP {response.status}")
          PY
