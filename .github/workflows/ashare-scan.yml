name: V3 A-share 4H Vegas Scan
# One-off A-share scan requested on 2026-10-21; Vegas rules unchanged.

on:
  workflow_dispatch:
  push:
    paths:
      - "v3_a_shares/run_ashare_scan.py"
      - "v3_a_shares/akshare_market_data.py"
      - "v3_a_shares/universe.json"
      - "v3_a_shares/README.md"
      - "v3/signal_system_v3.py"
      - "v3/bitget_market_data.py"
      - "v3/notification_digest.py"
      - ".github/workflows/ashare-scan.yml"

permissions:
  contents: read

concurrency:
  group: v3-ashare-4h-scan
  cancel-in-progress: false

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore same-day A-share digest state
        uses: actions/cache/restore@v4
        with:
          path: v3_a_shares/.state
          key: vegas-v3-ashare-digest-${{ github.run_id }}
          restore-keys: |
            vegas-v3-ashare-digest-
      - name: Install scan dependencies
        run: python -m pip install --upgrade pip baostock pandas
      - name: Scan fixed A-share pool using shared V3 rules
        working-directory: v3_a_shares
        run: python run_ashare_scan.py
      - name: Save same-day A-share digest state
        if: always() && hashFiles('v3_a_shares/.state/notifications.json') != ''
        uses: actions/cache/save@v4
        with:
          path: v3_a_shares/.state
          key: vegas-v3-ashare-digest-${{ github.run_id }}
