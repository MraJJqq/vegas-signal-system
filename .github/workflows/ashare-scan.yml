name: Vegas A-share Scan

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/ashare_scan.py"
      - ".github/workflows/ashare-scan.yml"
      - "pyproject.toml"
  schedule:
    - cron: "25 * * * 1-5"

permissions:
  contents: read

jobs:
  ashare-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install Vegas scanner and A-share data adapter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "akshare>=1.16"
      - name: Run A-share Vegas scan
        run: python scripts/ashare_scan.py | tee ashare-scan-log.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vegas-ashare-scan-${{ github.run_id }}
          path: |
            output/ashare/
            ashare-scan-log.txt
          if-no-files-found: warn
          retention-days: 14
