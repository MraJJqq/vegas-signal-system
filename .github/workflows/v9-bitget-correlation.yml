name: V9 Bitget 1H Correlation Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - 'v9/correlation_analysis.py'
      - '.github/workflows/v9-bitget-correlation.yml'

permissions:
  contents: write

jobs:
  correlation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Bitget 1H history and calculate correlations
        run: python v9/correlation_analysis.py
      - name: Upload correlation results
        uses: actions/upload-artifact@v4
        with:
          name: v9-bitget-1h-correlation
          path: v9/correlation/
          if-no-files-found: error
