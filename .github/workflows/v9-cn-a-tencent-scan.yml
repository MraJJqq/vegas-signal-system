name: VEGAS V9 A股 Tencent Legacy Manual Scan
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v9-cn-a-tencent-legacy-manual
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate legacy scanner only
        run: python -m py_compile v9_cn_a/tencent_scanner.py
      - name: Notice
        run: echo "Legacy Tencent scanner is manual-only. Production schedule uses Baostock workflow."
