name: Bitget-only US stock-token scan

on:
  push:
    paths:
      - ".github/workflows/scan-us-stocks.yml"
      - "config/us-stocks-settings.yaml"
      - "src/vegas_signal_system/bitget_provider.py"
      - "src/vegas_signal_system/scanner.py"
  workflow_dispatch:
  schedule:
    - cron: "37 * * * 1-5"

permissions:
  contents: read

jobs:
  scan-us-stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install scanner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "."
      - name: Scan Bitget-listed US stock tokens only
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_BASE_URL: ${{ vars.NTFY_BASE_URL || 'https://ntfy.sh' }}
        run: |
          set -o pipefail
          vegas-scan --config config/us-stocks-settings.yaml --provider bitget --output-dir output | tee scan-log.txt
          python - <<'PY'
          import glob, json, os, sys, urllib.request
          import pandas as pd

          topic = os.environ.get("NTFY_TOPIC", "").strip()
          if not topic:
              print("NTFY_TOPIC is not configured; scan completed but summary was not pushed.")
              sys.exit(0)

          files = sorted(glob.glob("output/scan_*.csv"))
          if not files:
              raise SystemExit("No scan CSV generated; cannot send a trustworthy summary.")
          df = pd.read_csv(files[-1]).fillna("")
          counts = df["status"].value_counts().to_dict() if "status" in df else {}
          names = {
              "WATCH_ENTRY_CONFIRMATION": "中锋触碰观察",
              "WATCH_ENTRY_CONDITIONS": "方向一致，等待触碰",
              "NO_TRADE_CONFLICT": "4H/8H方向冲突",
              "NO_TRADE_NEUTRAL": "方向不明确",
              "DATA_UNAVAILABLE": "行情数据不可用",
              "SCAN_ERROR": "扫描失败",
              "DIRECTION_ALIGNED": "方向一致",
          }
          lines = [
              "Vegas 主要美股扫描摘要",
              f"扫描标的：{len(df)}",
              "状态统计：" + "；".join(f"{names.get(str(k), str(k))} {int(v)}" for k, v in counts.items()),
              "",
              "逐个品种：",
          ]
          for _, row in df.iterrows():
              symbol = str(row.get("symbol_id", ""))
              status = names.get(str(row.get("status", "")), str(row.get("status", "未知")))
              d4 = str(row.get("direction_4h", "未知"))
              d8 = str(row.get("direction_8h", "未知"))
              close = str(row.get("close", "无"))
              lines.append(f"{symbol}: {status}；4H={d4} / 8H={d8}；最新参考价={close}")
          lines += [
              "",
              "数据源：Bitget 行情；未能从 Bitget 获取数据的品种不使用其他来源补齐。",
              "触碰观察不等于正式进场信号；仅供观察，不自动下单。",
          ]
          base = os.environ.get("NTFY_BASE_URL", "https://ntfy.sh").rstrip("/")
          payload = json.dumps({
              "topic": topic,
              "title": f"Vegas美股扫描摘要：{len(df)}个标的",
              "message": "\n".join(lines),
          }, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(
              base,
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=15) as response:
              print(f"ntfy summary accepted: HTTP {response.status}")
          PY
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-stocks-scan-${{ github.run_id }}
          path: |
            output/
            scan-log.txt
          if-no-files-found: warn
          retention-days: 14
