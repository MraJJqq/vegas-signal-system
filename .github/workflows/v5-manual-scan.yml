name: V5 Hourly Market Scan

on:
  workflow_dispatch:
  schedule:
    # Run once per hour. GitHub Actions cron is evaluated in UTC. Manual runs are supported via workflow_dispatch.
    - cron: "0 * * * *"
  push:
    branches: [main]
    paths:
      - "v5/**"
      - ".github/workflows/v5-manual-scan.yml"

permissions:
  contents: read

concurrency:
  group: v5-hourly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test V5 modules
        run: python -m unittest discover -s v5 -p "test_*.py" -v

      - name: Run V5 scan and send Server酱 WeChat digest
        env:
          PYTHONPATH: v5
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          set -o pipefail
          if [ -z "$SERVERCHAN_SENDKEY" ]; then
            echo "::error::Repository secret SERVERCHAN_SENDKEY is not configured."
            exit 1
          fi
          if [[ "$SERVERCHAN_SENDKEY" != SCT* ]]; then
            echo "::error::SERVERCHAN_SENDKEY must be a Server酱 Turbo key starting with SCT."
            exit 1
          fi
          python v5/run_v5_hourly.py --limit 1000 --state .state/v5_notifications.json
