name: V9 Scan Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  actions: read
  issues: write

concurrency:
  group: v9-scan-watchdog
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Detect missed or failed V9 scans
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=20) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None

          runs = request(api + "/actions/workflows/v9-bitget-scan.yml/runs?per_page=30")
          scanner_runs = runs.get("workflow_runs", [])
          now = datetime.now(timezone.utc)
          latest = scanner_runs[0] if scanner_runs else None
          successful = next(
              (r for r in scanner_runs if r.get("status") == "completed"
               and r.get("conclusion") == "success"),
              None,
          )

          problems = []
          if latest and latest.get("status") == "completed" and latest.get("conclusion") != "success":
              problems.append(
                  f"Latest V9 scan run #{latest['run_number']} ended with "
                  f"conclusion: {latest.get('conclusion')}."
              )

          if not successful:
              problems.append("No successful V9 scan run was found in the latest 30 runs.")
          else:
              last_ok = datetime.fromisoformat(successful["updated_at"].replace("Z", "+00:00"))
              age_minutes = (now - last_ok).total_seconds() / 60
              if age_minutes > 150:
                  problems.append(
                      f"Last successful V9 scan was {age_minutes:.0f} minutes ago "
                      "(alert threshold: 150 minutes)."
                  )

          open_issues = request(api + "/issues?state=open&per_page=100")
          watchdog_issue = next(
              (i for i in open_issues if not i.get("pull_request")
               and i.get("title") == "[V9 Watchdog] Scan health alert"),
              None,
          )

          if problems:
              details = "\\n".join(f"- {p}" for p in problems)
              run_url = latest.get("html_url", "Unavailable") if latest else "No run found"
              body = (
                  "The automated V9 scan watchdog detected a problem.\\n\\n"
                  f"{details}\\n\\nLatest run: {run_url}\\n\\n"
                  "Please inspect the V9 GitHub Actions workflow and its logs."
              )
              if watchdog_issue:
                  print(f"Watchdog alert remains open: {watchdog_issue['html_url']}")
              else:
                  created = request(
                      api + "/issues",
                      method="POST",
                      payload={
                          "title": "[V9 Watchdog] Scan health alert",
                          "body": body,
                      },
                  )
                  print(f"Created watchdog alert: {created['html_url']}")
              raise SystemExit("V9 scan health check failed.")
          else:
              print("V9 scan health is within the expected 150-minute window.")
              if watchdog_issue:
                  request(
                      api + f"/issues/{watchdog_issue['number']}",
                      method="PATCH",
                      payload={"state": "closed"},
                  )
                  print(f"Closed recovered watchdog alert #{watchdog_issue['number']}.")
          PY
