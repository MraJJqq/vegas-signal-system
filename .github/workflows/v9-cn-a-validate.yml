name: VEGAS V9 A股 Native 1H Validation
on:
  push:
    paths:
      - 'v9_cn_a/vegas_signals_cn.py'
      - 'v9_cn_a/baostock_scanner.py'
      - 'v9_cn_a/test_vegas_signals_cn.py'
      - '.github/workflows/v9-cn-a-validate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile A-share code
        run: python -m py_compile v9_cn_a/vegas_signals_cn.py v9_cn_a/baostock_scanner.py v9_cn_a/baostock_pool_builder.py v9_cn_a/test_vegas_signals_cn.py
      - name: Run signal regression tests
        working-directory: v9_cn_a
        run: python -m unittest -v test_vegas_signals_cn.py
