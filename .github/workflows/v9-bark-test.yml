name: VEGAS V9 Bark Test (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bark-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create harmless test report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path("/tmp/v9-bark-test-report.json").write_text(
              json.dumps({"signals": []}, ensure_ascii=False),
              encoding="utf-8",
          )
          PY
      - name: Send clearly marked Bark test notification
        env:
          V9_BARK_KEY: ${{ secrets.V9_BARK_KEY }}
          V9_NOTIFICATION_TEST_MODE: "1"
        run: python v9/ntfy_notifier.py /tmp/v9-bark-test-report.json
