name: V8 Tencent A-share Data Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-tencent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Tencent A-share daily K-lines
        run: python v8/tencent_test.py
