name: V8 Tencent A-share Data Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-tencent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Tencent A-share daily K-lines
        run: python v8/tencent_test.py

      - name: Send A-share workflow push test
        if: success()
        env:
          V8_NTFY_TOPIC: ${{ secrets.V8_NTFY_TOPIC }}
          V8_NTFY_TOKEN: ${{ secrets.V8_NTFY_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          topic = os.environ.get("V8_NTFY_TOPIC", "").strip()
          token = os.environ.get("V8_NTFY_TOKEN", "").strip()
          if not topic:
              print("ERROR: V8_NTFY_TOPIC is not configured in GitHub Actions Secrets.")
              sys.exit(1)

          payload = json.dumps({
              "topic": topic,
              "title": "VEGAS V8｜A股系统推送测试",
              "message": "A股数据测试工作流已运行成功。此消息用于验证 A股工作流 → ntfy 推送通道；当前仍是日线数据源测试，不代表正式4H Vegas扫描已接入。",
              "priority": 3
          }, ensure_ascii=False).encode("utf-8")
          headers = {"Content-Type": "application/json; charset=utf-8"}
          if token:
              headers["Authorization"] = f"Bearer {token}"

          request = urllib.request.Request(
              "https://ntfy.sh/", data=payload, headers=headers, method="POST"
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  if not 200 <= response.status < 300:
                      raise RuntimeError(f"ntfy HTTP {response.status}")
                  print(f"ntfy accepted A-share workflow test notification (HTTP {response.status}).")
          except Exception as exc:
              print(f"A-share push test failed: {exc}")
              sys.exit(1)
          PY
