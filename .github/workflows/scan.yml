name: Scheduled Vegas Scan

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/scan.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install scanner and optional market data provider
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[market-data]"
      - name: Run hourly market scan
        run: |
          if [ "${{ inputs.test_notification }}" = "true" ]; then\n            vegas-scan --config config/settings.yaml --test-notification | tee scan-log.txt\n          else\n            vegas-scan --config config/settings.yaml --provider yfinance --output-dir output | tee scan-log.txt\n          fi
          echo "## Vegas Signal Scan" >> "$GITHUB_STEP_SUMMARY"
          echo 'This scheduled run is an observation-only scan. It does not place orders.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Yahoo Finance symbols are data proxies and may differ from the broker chart.' >> "$GITHUB_STEP_SUMMARY"
          cat scan-log.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vegas-scan-${{ github.run_id }}
          path: |
            output/
            scan-log.txt
          if-no-files-found: warn
          retention-days: 14
