name: Scheduled Vegas Scan

# Scheduled Bitget BTC futures scan; workflow-file pushes also trigger a smoke test.
on:
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test notification only (does not scan markets)"
        required: false
        default: false
        type: boolean
  push:
    paths:
      - ".github/workflows/scan.yml"
      - "config/settings.yaml"
      - "src/vegas_signal_system/bitget_provider.py"
      - "src/vegas_signal_system/scanner.py"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install scanner and optional market data provider
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "."
      - name: Run Vegas scan or notification test
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_BASE_URL: ${{ vars.NTFY_BASE_URL || 'https://ntfy.sh' }}
        run: |
          if [[ "${{ github.event.inputs.test_notification }}" == "true" ]]; then
            vegas-scan --config config/settings.yaml --test-notification | tee scan-log.txt
          else
            vegas-scan --config config/settings.yaml --provider bitget --output-dir output | tee scan-log.txt
          fi
          echo "## Vegas Signal Scan" >> "$GITHUB_STEP_SUMMARY"
          echo 'Observation-only; no orders are placed.' >> "$GITHUB_STEP_SUMMARY"
          cat scan-log.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload scan results
        if: always() && github.event.inputs.test_notification != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vegas-scan-${{ github.run_id }}
          path: |
            output/
            scan-log.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Notify scan completion via ntfy
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_BASE_URL: ${{ vars.NTFY_BASE_URL || 'https://ntfy.sh' }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEST_ONLY: ${{ github.event.inputs.test_notification }}
        run: |
          python -c 'import json,os,urllib.request; t=os.environ.get("NTFY_TOPIC","").strip(); b=os.environ.get("NTFY_BASE_URL","https://ntfy.sh").rstrip("/"); s=os.environ.get("JOB_STATUS","unknown"); u=os.environ.get("RUN_URL",""); m="通知测试" if os.environ.get("TEST_ONLY","").lower()=="true" else "行情扫描"; p=json.dumps({"topic":t,"title":"Vegas合约扫描完成" if s=="success" else "Vegas合约扫描异常","message":f"任务类型：{m}\n任务状态：{s}\n仅观察信号，不自动下单。\n运行详情：{u}"},ensure_ascii=False).encode(); r=urllib.request.Request(b,data=p,headers={"Content-Type":"application/json; charset=utf-8"},method="POST"); urllib.request.urlopen(r,timeout=15).read() if t else print("NTFY_TOPIC missing; notification skipped")'

      - name: Notify scan completion via ntfy
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_BASE_URL: ${{ vars.NTFY_BASE_URL || 'https://ntfy.sh' }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEST_ONLY: ${{ github.event.inputs.test_notification }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          topic = os.environ.get("NTFY_TOPIC", "").strip()
          if not topic:
              print("NTFY_TOPIC is not configured; completion notification skipped.")
              raise SystemExit(0)
          status = os.environ.get("JOB_STATUS", "unknown")
          title = "Vegas合约扫描完成" if status == "success" else "Vegas合约扫描异常"
          mode = "通知测试" if os.environ.get("TEST_ONLY", "").lower() == "true" else "行情扫描"
          message = f"任务类型：{mode}\n任务状态：{status}\n本系统只观察信号，不自动下单。\n查看运行详情：{os.environ.get('RUN_URL', '')}"
          base = os.environ.get("NTFY_BASE_URL", "https://ntfy.sh").rstrip("/")
          payload = json.dumps({"topic": topic, "title": title, "message": message}, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(base, data=payload, headers={"Content-Type": "application/json; charset=utf-8"}, method="POST")
          with urllib.request.urlopen(req, timeout=15) as response:
              print(f"ntfy completion notification accepted: HTTP {response.status}")
          PY
