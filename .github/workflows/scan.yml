name: Scheduled Vegas Scan

on:
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test notification only (does not scan markets)"
        required: false
        default: false
        type: boolean
  push:
    paths:
      - ".github/workflows/scan.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install scanner and optional market data provider
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[market-data]"
      - name: Run Vegas scan or notification test
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          if [[ "${{ github.event.inputs.test_notification }}" == "true" ]]; then
            vegas-scan --config config/settings.yaml --test-notification | tee scan-log.txt
          else
            vegas-scan --config config/settings.yaml --provider yfinance --output-dir output | tee scan-log.txt
          fi
          echo "## Vegas Signal Scan" >> "$GITHUB_STEP_SUMMARY"
          echo 'Observation-only; no orders are placed.' >> "$GITHUB_STEP_SUMMARY"
          cat scan-log.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload scan results
        if: always() && github.event.inputs.test_notification != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vegas-scan-${{ github.run_id }}
          path: |
            output/
            scan-log.txt
          if-no-files-found: warn
          retention-days: 14
