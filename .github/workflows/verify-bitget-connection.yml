name: Verify Bitget 4H Market Data

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Bitget USDT-FUTURES symbol, e.g. BTCUSDT"
        required: true
        default: "BTCUSDT"

permissions:
  contents: read

jobs:
  verify-bitget-4h:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch and validate live Bitget 4H candles
        env:
          SYMBOL: ${{ inputs.symbol }}
        run: |
          python - <<'PY'
          import json
          import math
          import os
          import time
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          symbol = os.environ["SYMBOL"].strip().upper()
          if not symbol or not symbol.endswith("USDT"):
              raise SystemExit("FAIL: symbol must be a USDT-quoted contract such as BTCUSDT")

          query = urlencode({
              "symbol": symbol,
              "productType": "USDT-FUTURES",
              "granularity": "4H",
              "limit": "10",
          })
          url = "https://api.bitget.com/api/v2/mix/market/candles?" + query
          request = Request(url, headers={"User-Agent": "VegasSignalSystemV3/1.0"})
          try:
              with urlopen(request, timeout=15) as response:
                  payload = json.loads(response.read().decode("utf-8"))
          except Exception as exc:
              raise SystemExit(f"FAIL: Bitget HTTP/JSON request failed: {exc}")

          if not isinstance(payload, dict) or payload.get("code") != "00000":
              raise SystemExit(f"FAIL: Bitget API error: {payload!r}")
          rows = payload.get("data")
          if not isinstance(rows, list) or not rows:
              raise SystemExit("FAIL: Bitget returned no candle rows")

          now_ms = int(time.time() * 1000)
          duration_ms = 4 * 60 * 60 * 1000
          valid = []
          for row in rows:
              if not isinstance(row, list) or len(row) < 6:
                  raise SystemExit(f"FAIL: malformed candle row: {row!r}")
              try:
                  ts = int(row[0])
                  o, h, low, c, volume = map(float, row[1:6])
              except (TypeError, ValueError) as exc:
                  raise SystemExit(f"FAIL: non-numeric candle: {row!r}") from exc
              if not all(math.isfinite(v) for v in (o, h, low, c, volume)):
                  raise SystemExit(f"FAIL: non-finite candle: {row!r}")
              if min(o, h, low, c) <= 0 or h < max(o, c, low) or low > min(o, c, h) or volume < 0:
                  raise SystemExit(f"FAIL: invalid OHLCV candle: {row!r}")
              if ts + duration_ms <= now_ms:
                  valid.append((ts, o, h, low, c, volume))

          valid.sort(key=lambda item: item[0])
          if not valid:
              raise SystemExit("FAIL: no fully closed 4H candles returned")

          latest = valid[-1]
          from datetime import datetime, timezone
          latest_time = datetime.fromtimestamp(latest[0] / 1000, tz=timezone.utc).isoformat()
          print("PASS: Bitget live market-data connection")
          print(f"symbol={symbol} productType=USDT-FUTURES granularity=4H")
          print(f"rows_received={len(rows)} closed_valid_rows={len(valid)}")
          print(f"latest_closed_candle_utc={latest_time}")
          print(f"latest_closed_candle_close={latest[4]}")
          print("Current in-progress candle excluded from validation output.")
          PY
