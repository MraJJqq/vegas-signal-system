name: V3 Hourly Runner Validation

on:
  push:
    paths:
      - "v3/run_v3_hourly.py"
      - "v3/notification_digest.py"
      - "v3/test_notification_digest.py"
      - ".github/workflows/test-v3-hourly-runner.yml"
  pull_request:
    paths:
      - "v3/run_v3_hourly.py"
      - "v3/notification_digest.py"
      - "v3/test_notification_digest.py"
      - ".github/workflows/test-v3-hourly-runner.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile hourly runner and run digest tests
        working-directory: v3
        run: |
          python -m py_compile run_v3_hourly.py notification_digest.py
          python -m unittest -v test_notification_digest.py
