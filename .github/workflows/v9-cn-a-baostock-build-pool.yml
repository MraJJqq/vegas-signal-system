name: VEGAS V9 A股 Baostock Build 2000-Stock Pool
on:
  push:
    paths:
      - 'v9_cn_a/baostock_pool_builder.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v9-cn-a-baostock-pool-builder
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Baostock
        run: python -m pip install --upgrade pip baostock
      - name: Validate builder
        run: python -m py_compile v9_cn_a/baostock_pool_builder.py
      - name: Rank A-shares by recent traded amount
        run: python v9_cn_a/baostock_pool_builder.py
      - name: Persist recommended pool
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v9_cn_a/baostock-stock-pool.json
          git commit -m 'chore(v9-cn-a): refresh Baostock top-2000 stock pool' || echo 'Pool unchanged'
          git push
      - name: Upload pool report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vegas-v9-cn-a-baostock-2000-stock-pool
          path: v9_cn_a/baostock-stock-pool.json
          if-no-files-found: warn
          retention-days: 30
