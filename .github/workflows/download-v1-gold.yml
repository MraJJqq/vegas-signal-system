name: V1 GOLD Data Connection

on:
  push:
    paths:
      - "backtest_system/download_gold_data.py"
      - "backtest_system/bitget_market_data.py"
      - ".github/workflows/download-v1-gold.yml"
  workflow_dispatch:
    inputs:
      days:
        description: "History window in days (30-730)"
        required: true
        default: "180"
      symbol:
        description: "Bitget USDT-FUTURES symbol"
        required: true
        default: "XAUUSDT"

permissions:
  contents: read

jobs:
  download-gold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download Bitget GOLD candles
        working-directory: backtest_system
        env:
          SYMBOL: ${{ github.event.inputs.symbol || 'XAUUSDT' }}
          DAYS: ${{ github.event.inputs.days || '180' }}
        run: |
          python -m py_compile bitget_market_data.py download_gold_data.py
          python download_gold_data.py --symbol "$SYMBOL" --days "$DAYS" --output-dir output
      - name: Upload GOLD data and connection report
        uses: actions/upload-artifact@v4
        with:
          name: v1-gold-historical-data
          path: |
            backtest_system/output/gold_candles.csv
            backtest_system/output/gold_data_report.json
          if-no-files-found: error
          retention-days: 14
