name: V1 V3 System Monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check recent V1 and V3 test workflow failures
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_BASE_URL: ${{ vars.NTFY_BASE_URL }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          topic = os.environ.get("NTFY_TOPIC", "").strip()
          base = os.environ.get("NTFY_BASE_URL", "").strip() or "https://ntfy.sh"
          api = f"https://api.github.com/repos/{repo}/actions/runs?per_page=100"
          req = urllib.request.Request(api, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  runs = json.load(response).get("workflow_runs", [])
          except Exception as exc:
              print(f"Unable to query GitHub Actions: {exc}", file=sys.stderr)
              sys.exit(1)

          targets = {
              "V1 Trading System Tests": "V1 交易系统测试",
              "Vegas Signal System V3 Tests": "V3 信号系统测试",
          }
          now = datetime.now(timezone.utc)
          cutoff = now - timedelta(minutes=20)
          alerts = []

          for workflow_name, label in targets.items():
              matching = [r for r in runs if r.get("name") == workflow_name]
              matching.sort(key=lambda r: r.get("run_number", 0), reverse=True)
              if not matching:
                  alerts.append(f"{label}：未找到测试工作流记录。")
                  continue
              run = matching[0]
              updated = datetime.fromisoformat(run["updated_at"].replace("Z", "+00:00"))
              conclusion = run.get("conclusion")
              status = run.get("status")
              if status == "in_progress":
                  print(f"{label}: workflow is running ({run['html_url']})")
              elif updated >= cutoff and conclusion in ("failure", "cancelled", "timed_out", "action_required"):
                  alerts.append(f"{label}异常：{conclusion}。查看：{run['html_url']}")
              else:
                  print(f"{label}: latest run status={status}, conclusion={conclusion}, updated={run['updated_at']}")

          if not alerts:
              print("Monitor check complete: no recent V1/V3 test failures detected.")
              sys.exit(0)

          message = "\n".join(alerts)
          print("ALERT:\n" + message)
          if not topic:
              print("NTFY_TOPIC secret is not configured; cannot send ntfy notification.", file=sys.stderr)
              sys.exit(2)

          url = base.rstrip("/") + "/" + urllib.parse.quote(topic, safe="")
          request = urllib.request.Request(
              url,
              data=message.encode("utf-8"),
              headers={
                  "Title": "VEGAS V1/V3 运行监控告警",
                  "Priority": "high",
                  "Tags": "warning",
                  "Content-Type": "text/plain; charset=utf-8",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print(f"ntfy notification sent; HTTP {response.status}")
          except urllib.error.HTTPError as exc:
              print(f"ntfy notification failed: HTTP {exc.code}", file=sys.stderr)
              sys.exit(3)
          except Exception as exc:
              print(f"ntfy notification failed: {exc}", file=sys.stderr)
              sys.exit(3)
          PY
