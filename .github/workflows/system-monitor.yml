name: V3 Runtime Monitor

on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: v3-runtime-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check V3 scan workflow health
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_BASE_URL: ${{ vars.NTFY_BASE_URL }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          topic = os.environ.get("NTFY_TOPIC", "").strip()
          base = os.environ.get("NTFY_BASE_URL", "").strip() or "https://ntfy.sh"
          api = f"https://api.github.com/repos/{repo}/actions/runs?per_page=100"
          req = urllib.request.Request(api, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  runs = json.load(response).get("workflow_runs", [])
          except Exception as exc:
              print(f"Unable to query GitHub Actions: {exc}", file=sys.stderr)
              sys.exit(1)

          target = "Vegas V3 Hourly Market Scan"
          matching = [r for r in runs if r.get("name") == target]
          matching.sort(key=lambda r: r.get("run_number", 0), reverse=True)
          alerts = []
          now = datetime.now(timezone.utc)

          if not matching:
              alerts.append("V3 运行异常：没有找到扫描工作流运行记录。")
          else:
              run = matching[0]
              status = run.get("status")
              conclusion = run.get("conclusion")
              url = run.get("html_url", "")
              created = datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
              if status == "completed" and conclusion != "success":
                  alerts.append(f"V3 扫描失败：{conclusion or 'unknown'}。查看：{url}")
              elif status != "completed" and now - created > timedelta(minutes=90):
                  alerts.append(f"V3 扫描运行超过 90 分钟仍未完成。查看：{url}")
              elif status == "completed" and now - created > timedelta(minutes=90):
                  alerts.append(f"V3 超过 90 分钟没有新的扫描运行。最近一次：{conclusion}。查看：{url}")
              else:
                  print(f"V3 monitor OK: status={status}, conclusion={conclusion}, run={url}")

          if not alerts:
              sys.exit(0)

          message = "\n".join(alerts)
          print("ALERT:\n" + message)
          if not topic:
              print("NTFY_TOPIC is missing; unable to send alert.", file=sys.stderr)
              sys.exit(2)

          url = base.rstrip("/") + "/" + urllib.parse.quote(topic, safe="")
          request = urllib.request.Request(
              url,
              data=message.encode("utf-8"),
              headers={
                  "Title": "VEGAS V3 运行监控",
                  "Priority": "high",
                  "Tags": "warning",
                  "Content-Type": "text/plain; charset=utf-8",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print(f"ntfy alert sent; HTTP {response.status}")
          except Exception as exc:
              print(f"ntfy alert failed: {exc}", file=sys.stderr)
              sys.exit(3)
          PY
