name: Vegas V3 Hourly Market Scan

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/v3-hourly-scan.yml"
      - "v3/bitget_market_data.py"
      - "v3/signal_system_v3.py"
      - "v3/run_v3_hourly.py"
      - "v3/notification_digest.py"
      - "v3/VEGAS_SIGNAL_SYSTEM_V3.md"

permissions:
  contents: read

concurrency:
  group: vegas-v3-hourly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      V3_SYMBOLS: 'SPYUSDT,QQQUSDT,SNDKUSDT,NVDAUSDT,AMDUSDT,AVGOUSDT,MUUSDT,TSMUSDT,MSFTUSDT,AAPLUSDT,TSLAUSDT,ARMUSDT,AMZNUSDT,METAUSDT,GOOGLUSDT,ORCLUSDT,PLTRUSDT,COINUSDT,MSTRUSDT,HOODUSDT,XAUUSDT,CLUSDT,HYPEUSDT'
      V3_TIMEZONE: ${{ vars.V3_TIMEZONE || 'Asia/Shanghai' }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      V3_STATE_FILE: v3-state/notifications.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore same-day digest state
        uses: actions/cache/restore@v4
        with:
          path: v3-state
          key: vegas-v3-digest-${{ github.run_id }}
          restore-keys: |
            vegas-v3-digest-
      - name: Validate ntfy configuration
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::error::Repository secret NTFY_TOPIC is missing."
            exit 1
          fi
      - name: Run V3 scan and send daily digest
        working-directory: v3
        run: python run_v3_hourly.py --state ../v3-state/notifications.json --timezone "$V3_TIMEZONE"
      - name: Save same-day digest state
        if: always() && hashFiles('v3-state/notifications.json') != ''
        uses: actions/cache/save@v4
        with:
          path: v3-state
          key: vegas-v3-digest-${{ github.run_id }}
