name: V9 Bark Pending Retry

on:
  workflow_dispatch:
  schedule:
    # Retry pending notifications only between Beijing 08:00 and 21:50.
    - cron: "20,50 0-13 * * *"

permissions:
  actions: read
  contents: write

concurrency:
  group: v9-bark-pending-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Avoid overlapping an active market scan
        id: scan_guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          url = f"https://api.github.com/repos/{repo}/actions/workflows/v9-bitget-scan.yml/runs?per_page=10"
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              runs = json.load(response).get("workflow_runs", [])
          active = [run for run in runs if run.get("status") in {"queued", "in_progress"}]
          if active:
              print("A V9 scan is active; defer Bark retry to the next 30-minute slot.")
              for run in active:
                  print(f"Active scan #{run.get('run_number')}: {run.get('html_url')}")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("skip=true\n")
          else:
              print("No active V9 scan; Bark retry may proceed.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("skip=false\n")
          PY

      - name: Retry pending Bark notification
        id: retry
        if: steps.scan_guard.outputs.skip != 'true'
        env:
          V9_BARK_KEY: ${{ secrets.V9_BARK_KEY }}
        run: python v9/ntfy_notifier.py --retry-pending

      - name: Persist Bark retry state
        if: always() && steps.retry.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f v9/.bark-notification-state.json ]; then
            git add -f v9/.bark-notification-state.json
          fi
          if [ -f v9/.bark-pending-notification-state.json ]; then
            git add -f v9/.bark-pending-notification-state.json
          fi
          if git diff --cached --quiet; then
            echo "Bark retry state unchanged; no commit required."
            exit 0
          fi
          git commit -m "chore(bark): persist independent pending retry state"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "State changed concurrently; retry persistence will be handled by the next run."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Bark retry state push attempt $attempt failed; refreshing remote."
          done
          echo "::error::Unable to persist Bark retry state after 3 attempts."
          exit 1
