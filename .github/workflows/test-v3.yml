name: Vegas Signal System V3 Tests

on:
  push:
    paths:
      - "signal_system_v3.py"
      - "test_signal_system_v3.py"
      - ".github/workflows/test-v3.yml"
  pull_request:
    paths:
      - "signal_system_v3.py"
      - "test_signal_system_v3.py"
      - ".github/workflows/test-v3.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run V3 unit tests
        run: python -m unittest -v test_signal_system_v3.py
