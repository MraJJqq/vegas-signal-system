name: Vegas Signal System V3 Tests

on:
  push:
    paths:
      - "v3/**"
      - ".github/workflows/test-v3.yml"
  pull_request:
    paths:
      - "v3/**"
      - ".github/workflows/test-v3.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run V3 signal, market-data, and notification tests
        working-directory: v3
        run: |
          python -m unittest -v test_signal_system_v3.py test_bitget_market_data.py test_notification_digest.py
          python -m py_compile signal_system_v3.py bitget_market_data.py notification_digest.py run_v3_scan.py test_notification_digest.py
