name: VEGAS V9 A股 Baostock Native 1H Scan
on:
  schedule:
    # Beijing time: after the 10:30, 11:30, 14:00 and 15:00 bar closes.
    - cron: "30 2,3 * * 1-5"
    - cron: "0 6,7 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v9-cn-a-native-1h-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore 1H candle cache
        uses: actions/cache/restore@v4
        with:
          path: v9_cn_a/.candle-cache.json
          key: v9-cn-a-1h-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            v9-cn-a-1h-
            v9-cn-a-candles-
      - name: Install Baostock
        run: python -m pip install --upgrade pip baostock
      - name: Compile and validate isolated A-share code
        run: python -m py_compile v9_cn_a/vegas_signals_cn.py v9_cn_a/baostock_scanner.py v9_cn_a/baostock_pool_builder.py
      - name: Run native 1H A-share scan
        env:
          V9_CN_A_STATE_PATH: v9_cn_a/.signal-state.json
          V9_CN_A_REPORT_PATH: v9_cn_a/scan-report.json
          V9_CN_A_POOL_PATH: v9_cn_a/baostock-stock-pool.json
          V9_CN_A_CANDLE_CACHE_PATH: v9_cn_a/.candle-cache.json
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python v9_cn_a/baostock_scanner.py
      - name: Persist A-share state only
        if: always()
        run: |
          if [ -f v9_cn_a/.signal-state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f v9_cn_a/.signal-state.json
            if ! git diff --cached --quiet; then
              git commit -m 'chore(v9-cn-a): persist native 1H signal state'
              branch="${GITHUB_REF_NAME}"
              git fetch origin "$branch"
              if ! git rebase "origin/$branch"; then
                git rebase --abort
                exit 1
              fi
              git push origin "HEAD:$branch"
            fi
          fi
      - name: Save 1H candle cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: v9_cn_a/.candle-cache.json
          key: v9-cn-a-1h-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload A-share scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vegas-v9-cn-a-native-1h-report
          path: v9_cn_a/scan-report.json
          if-no-files-found: warn
          retention-days: 14
