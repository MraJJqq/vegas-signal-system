name: V9 Schedule Watchdog

on:
  schedule:
    # Check 30 minutes after each Beijing scan slot (UTC: 00, 04, 08, 12, 14).
    - cron: "30 0,4,8,12,14 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check-scheduled-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check today's scheduled V9 scan and alert only if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V9_BARK_KEY: ${{ secrets.V9_BARK_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          slots = (0, 4, 8, 12, 14)
          now = datetime.now(timezone.utc)
          slot_hour = max((hour for hour in slots if hour <= now.hour), default=None)
          if slot_hour is None or now.minute < 30:
              print("Manual or unexpected invocation outside watchdog checkpoints; no alert sent.")
              sys.exit(0)

          scheduled = now.replace(hour=slot_hour, minute=0, second=0, microsecond=0)
          if (now - scheduled).total_seconds() > 90 * 60:
              print("No matching checkpoint window; skipping to avoid a stale alert.")
              sys.exit(0)

          url = (
              "https://api.github.com/repos/MraJJqq/vegas-signal-system/"
              "actions/workflows/v9-bitget-scan.yml/runs?event=schedule&per_page=100"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              data = json.loads(response.read().decode("utf-8"))

          matching = []
          for run in data.get("workflow_runs", []):
              created = datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
              if scheduled <= created <= now:
                  matching.append(run)

          if matching:
              latest = max(matching, key=lambda item: item["created_at"])
              print(
                  "Scheduled V9 scan detected: "
                  f"run #{latest['run_number']} status={latest['status']} "
                  f"conclusion={latest.get('conclusion')} created={latest['created_at']}"
              )
              if latest["status"] != "completed":
                  print("Scan is still running; no missing-scan alert.")
              elif latest.get("conclusion") != "success":
                  print("Scheduled scan ran but did not succeed; alerting.")
              else:
                  print("Scheduled scan completed successfully.")
                  sys.exit(0)
              reason = (
                  f"定时扫描已触发但未成功：run #{latest['run_number']}，"
                  f"状态 {latest['status']} / {latest.get('conclusion')}。"
              )
          else:
              beijing_hour = (slot_hour + 8) % 24
              reason = (
                  f"未检测到今天北京时间 {beijing_hour:02d}:00 的 V9 定时扫描记录。"
                  "请检查 GitHub Actions 调度状态。"
              )
              print(reason)

          bark_key = os.environ.get("V9_BARK_KEY", "").strip()
          if not bark_key:
              raise RuntimeError("V9_BARK_KEY is missing; cannot deliver watchdog alert.")

          payload = json.dumps({
              "device_key": bark_key,
              "title": "VEGAS V9 定时扫描告警",
              "body": reason,
              "group": "VEGAS V9",
              "level": "active",
          }, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(
              "https://api.day.app/push",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              print(f"Bark watchdog alert accepted: HTTP {response.status}")
          PY
