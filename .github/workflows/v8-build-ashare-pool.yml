name: V8 Build Full A-Share Scan Pool

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and validate full A-share pool from Tencent native 4H data
        run: python v8/build_ashare_scan_pool.py

      - name: Upload pool and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-ashare-pool-build-report
          path: |
            v8/ashare_scan_pool.json
            v8/ashare_pool_build_report.json
          if-no-files-found: warn
          retention-days: 14
