# All live market scans use Bitget only. Unsupported instruments fail visibly; no alternate source.
app:
  name: "Vegas信号系统"
  timezone: "UTC"
  output_dir: "output"
  csv_data_dir: "data/sample"
market_data:
  provider: "bitget"
  history_limit: 2000
symbols:
  - {id: "GOLD", name: "黄金（Bitget黄金代币候选）", enabled: true, bitget_symbol: "PAXGUSDT", bitget_category: "SPOT"}
  - {id: "CRUDE_OIL", name: "原油（Bitget CLUSDT U本位永续合约）", enabled: true, bitget_symbol: "CLUSDT", bitget_category: "USDT-FUTURES", bitget_product_type: "USDT-FUTURES"}
  - {id: "BTC", name: "比特币（Bitget USDT合约）", enabled: true, bitget_symbol: "BTCUSDT", bitget_category: "USDT-FUTURES", bitget_product_type: "USDT-FUTURES"}
  - {id: "SNDK", name: "闪迪（USDT合约候选）", enabled: true, bitget_symbol: "SNDKUSDT", bitget_category: "USDT-FUTURES", bitget_product_type: "USDT-FUTURES"}
timeframes:
  direction_sources: ["4h"]
  entry_watch: ["1h", "2h"]
  required_columns: ["timestamp", "open", "high", "low", "close", "volume"]
indicators:
  filter_sma: 2
  entry_ema: 36
  direction_ema: 144
  direction_ema_alternative: 169
  major_ema: 576
rules:
  block_when_direction_conflicts: true
  require_entry_midline_touch: true
  entry_midline_ema: 144
  entry_midline_touch_mode: "high_low_overlap"
  emit_candidate_observations: true
notifications:
  enabled: true
  provider: "ntfy"
  topic_env: "NTFY_TOPIC"
