# Vegas Signal System configuration
# Yahoo Finance symbols are data proxies and must be checked against your chart venue.
app:
  name: "Vegas信号系统"
  timezone: "UTC"
  output_dir: "output"
  csv_data_dir: "data/sample"

market_data:
  provider: "csv"
  history_period: "60d"

symbols:
  - id: "GOLD"
    name: "黄金"
    enabled: true
    provider_symbol: "GC=F"
  - id: "CRUDE_OIL"
    name: "原油"
    enabled: true
    provider_symbol: "CL=F"
  - id: "BTC"
    name: "比特币"
    enabled: true
    provider_symbol: "BTC-USD"

timeframes:
  direction_sources: ["4h", "8h"]
  entry_watch: ["1h", "2h"]
  required_columns: ["timestamp", "open", "high", "low", "close", "volume"]

indicators:
  filter_sma: 2
  entry_ema: 36
  direction_ema: 144
  direction_ema_alternative: 169
  major_ema: 576

rules:
  block_when_direction_conflicts: true
  require_entry_midline_touch: true
  emit_candidate_observations: true

notifications:
  enabled: false
  provider: "none"
