# Bitget-only USDT futures scan. All stock/ETF symbols are configured as USDT-margined contracts.
# If Bitget does not list a contract or return candles, the result is DATA_UNAVAILABLE; no spot-token or alternate-source fallback.
app:
  name: "Vegas美股扫描（Bitget数据源）"
  timezone: "UTC"
  output_dir: "output"
  csv_data_dir: "data/sample"
market_data:
  provider: "bitget"
  history_limit: 2000
symbols:
  - {id: "SPY", name: "标普500 ETF合约候选", enabled: true, bitget_symbol: "SPYUSDT", bitget_category: "USDT-FUTURES", bitget_product_type: "USDT-FUTURES"}
  - {id: "QQQ", name: "纳斯达克100 ETF合约候选", enabled: true, bitget_symbol: "QQQUSDT", bitget_category: "USDT-FUTURES", bitget_product_type: "USDT-FUTURES"}
  - {id: "SNDK", name: "闪迪USDT合约候选", enabled: true, bitget_symbol: "SNDKUSDT", bitget_category: "USDT-FUTURES", bitget_product_type: "USDT-FUTURES"}
  - {id: "NVDA", name: "英伟达USDT合约候选", enabled: true, bitget_symbol: "NVDAUSDT", bitget_category: "USDT-FUTURES", bitget_product_type: "USDT-FUTURES"}
  - {id: "AMD", name: "AMD USDT合约候选", enabled: true, bitget_symbol: "AMDUSDT", bitget_category: "USDT-FUTURES", bitget_product_type: "USDT-FUTURES"}
  - {id: "AVGO", name: "博通USDT合约候选", enabled: true, bitget_symbol: "AVGOUSDT", bitget_category: "USDT-FUTURES", bitget_product_type: "USDT-FUTURES"}
  - {id: "MU", name: "美光USDT合约候选", enabled: true, bitget_symbol: "MUUSDT", bitget_category: "USDT-FUTURES", bitget_product_type: "USDT-FUTURES"}
  - {id: "TSM", name: "台积电USDT合约候选", enabled: true, bitget_symbol: "TSMUSDT", bitget_category: "USDT-FUTURES", bitget_product_type: "USDT-FUTURES"}
  - {id: "ARM", name: "Arm USDT合约候选", enabled: true, bitget_symbol: "ARMUSDT", bitget_category: "USDT-FUTURES", bitget_product_type: "USDT-FUTURES"}
  - {id: "MSFT", name: "微软USDT合约候选", enabled: true, bitget_symbol: "MSFTUSDT", bitget_category: "USDT-FUTURES", bitget_product_type: "USDT-FUTURES"}
  - {id: "AAPL", name: "苹果USDT合约候选", enabled: true, bitget_symbol: "AAPLUSDT", bitget_category: "USDT-FUTURES", bitget_product_type: "USDT-FUTURES"}
  - {id: "AMZN", name: "亚马逊USDT合约候选", enabled: true, bitget_symbol: "AMZNUSDT", bitget_category: "USDT-FUTURES", bitget_product_type: "USDT-FUTURES"}
  - {id: "META", name: "Meta USDT合约候选", enabled: true, bitget_symbol: "METAUSDT", bitget_category: "USDT-FUTURES", bitget_product_type: "USDT-FUTURES"}
  - {id: "GOOGL", name: "谷歌USDT合约候选", enabled: true, bitget_symbol: "GOOGLUSDT", bitget_category: "USDT-FUTURES", bitget_product_type: "USDT-FUTURES"}
  - {id: "TSLA", name: "特斯拉USDT合约候选", enabled: true, bitget_symbol: "TSLAUSDT", bitget_category: "USDT-FUTURES", bitget_product_type: "USDT-FUTURES"}
  - {id: "PLTR", name: "Palantir USDT合约候选", enabled: true, bitget_symbol: "PLTRUSDT", bitget_category: "USDT-FUTURES", bitget_product_type: "USDT-FUTURES"}
