# Bitget-only stock-token scan. A symbol is scanned only against the configured Bitget market.
# If Bitget does not list a symbol or return candles, the result is DATA_UNAVAILABLE/SCAN_ERROR.
app:
  name: "Vegas美股扫描（Bitget数据源）"
  timezone: "UTC"
  output_dir: "output"
  csv_data_dir: "data/sample"
market_data:
  provider: "bitget"
  history_limit: 2000
symbols:
  - {id: "SPY", name: "标普500 ETF代币", enabled: true, bitget_stock_code: "SPY"}
  - {id: "QQQ", name: "纳斯达克100 ETF代币", enabled: true, bitget_stock_code: "QQQ"}
  - {id: "SNDK", name: "闪迪股票代币", enabled: true, bitget_stock_code: "SNDK"}
  - {id: "NVDA", name: "英伟达股票代币", enabled: true, bitget_stock_code: "NVDA"}
  - {id: "AMD", name: "AMD股票代币", enabled: true, bitget_stock_code: "AMD"}
  - {id: "AVGO", name: "博通股票代币", enabled: true, bitget_stock_code: "AVGO"}
  - {id: "MU", name: "美光股票代币", enabled: true, bitget_stock_code: "MU"}
  - {id: "TSM", name: "台积电股票代币", enabled: true, bitget_stock_code: "TSM"}
  - {id: "ARM", name: "Arm股票代币", enabled: true, bitget_stock_code: "ARM"}
  - {id: "MSFT", name: "微软股票代币", enabled: true, bitget_stock_code: "MSFT"}
  - {id: "AAPL", name: "苹果股票代币", enabled: true, bitget_stock_code: "AAPL"}
  - {id: "AMZN", name: "亚马逊股票代币", enabled: true, bitget_stock_code: "AMZN"}
  - {id: "META", name: "Meta股票代币", enabled: true, bitget_stock_code: "META"}
  - {id: "GOOGL", name: "谷歌股票代币", enabled: true, bitget_stock_code: "GOOGL"}
  - {id: "TSLA", name: "特斯拉股票代币", enabled: true, bitget_stock_code: "TSLA"}
  - {id: "PLTR", name: "Palantir股票代币", enabled: true, bitget_stock_code: "PLTR"}
  - {id: "ORCL", name: "甲骨文股票代币", enabled: true, bitget_stock_code: "ORCL"}
  - {id: "COIN", name: "Coinbase股票代币", enabled: true, bitget_stock_code: "COIN"}
  - {id: "MSTR", name: "Strategy股票代币", enabled: true, bitget_stock_code: "MSTR"}
  - {id: "HOOD", name: "Robinhood股票代币", enabled: true, bitget_stock_code: "HOOD"}
timeframes:
  direction_sources: ["4h", "8h"]
  entry_watch: ["1h", "2h"]
  required_columns: ["timestamp", "open", "high", "low", "close", "volume"]
indicators:
  filter_sma: 2
  entry_ema: 36
  direction_ema: 144
  direction_ema_alternative: 169
  major_ema: 576
rules:
  block_when_direction_conflicts: true
  require_entry_midline_touch: true
  entry_midline_ema: 144
  entry_midline_touch_mode: "high_low_overlap"
  emit_candidate_observations: true
notifications:
  enabled: true
  provider: "ntfy"
  topic_env: "NTFY_TOPIC"
