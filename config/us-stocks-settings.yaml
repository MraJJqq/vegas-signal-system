# One-off/ongoing US equities overview scan via Yahoo Finance proxy data.
# These are observation instruments, not a recommendation to trade every ticker.
app:
  name: "Vegas美股扫描"
  timezone: "UTC"
  output_dir: "output"
  csv_data_dir: "data/sample"
market_data:
  provider: "yfinance"
  history_period: "60d"
symbols:
  - {id: "SPY", name: "标普500 ETF", enabled: true, provider_symbol: "SPY"}
  - {id: "QQQ", name: "纳斯达克100 ETF", enabled: true, provider_symbol: "QQQ"}
  - {id: "SNDK", name: "闪迪", enabled: true, provider_symbol: "SNDK"}
  - {id: "NVDA", name: "英伟达", enabled: true, provider_symbol: "NVDA"}
  - {id: "AMD", name: "超威半导体", enabled: true, provider_symbol: "AMD"}
  - {id: "AVGO", name: "博通", enabled: true, provider_symbol: "AVGO"}
  - {id: "MU", name: "美光科技", enabled: true, provider_symbol: "MU"}
  - {id: "TSM", name: "台积电ADR", enabled: true, provider_symbol: "TSM"}
  - {id: "ARM", name: "Arm", enabled: true, provider_symbol: "ARM"}
  - {id: "MSFT", name: "微软", enabled: true, provider_symbol: "MSFT"}
  - {id: "AAPL", name: "苹果", enabled: true, provider_symbol: "AAPL"}
  - {id: "AMZN", name: "亚马逊", enabled: true, provider_symbol: "AMZN"}
  - {id: "META", name: "Meta", enabled: true, provider_symbol: "META"}
  - {id: "GOOGL", name: "谷歌A", enabled: true, provider_symbol: "GOOGL"}
  - {id: "TSLA", name: "特斯拉", enabled: true, provider_symbol: "TSLA"}
  - {id: "PLTR", name: "Palantir", enabled: true, provider_symbol: "PLTR"}
  - {id: "ORCL", name: "甲骨文", enabled: true, provider_symbol: "ORCL"}
  - {id: "COIN", name: "Coinbase", enabled: true, provider_symbol: "COIN"}
  - {id: "MSTR", name: "Strategy", enabled: true, provider_symbol: "MSTR"}
  - {id: "HOOD", name: "Robinhood", enabled: true, provider_symbol: "HOOD"}
timeframes:
  direction_sources: ["4h", "8h"]
  entry_watch: ["1h", "2h"]
  required_columns: ["timestamp", "open", "high", "low", "close", "volume"]
indicators:
  filter_sma: 2
  entry_ema: 36
  direction_ema: 144
  direction_ema_alternative: 169
  major_ema: 576
rules:
  block_when_direction_conflicts: true
  require_entry_midline_touch: true
  entry_midline_ema: 144
  entry_midline_touch_mode: "high_low_overlap"
  emit_candidate_observations: true
notifications:
  enabled: true
  provider: "ntfy"
  topic_env: "NTFY_TOPIC"
