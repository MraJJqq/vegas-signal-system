  - {id: "MSTR", name: "Strategy USDT合约候选", enabled: true, bitget_symbol: "MSTRUSDT", bitget_category: "USDT-FUTURES", bitget_product_type: "USDT-FUTURES"}
  - {id: "HOOD", name: "Robinhood USDT合约候选", enabled: true, bitget_symbol: "HOODUSDT", bitget_category: "USDT-FUTURES", bitget_product_type: "USDT-FUTURES"}
timeframes:
  direction_sources: ["4h", "8h"]
  entry_watch: ["1h", "2h"]
  required_columns: ["timestamp", "open", "high", "low", "close", "volume"]
indicators:
  filter_sma: 2
  entry_ema: 36
  direction_ema: 144
  direction_ema_alternative: 169
  major_ema: 576
rules:
  block_when_direction_conflicts: true
  require_entry_midline_touch: true
  entry_midline_ema: 144
  entry_midline_touch_mode: "high_low_overlap"
  emit_candidate_observations: true
notifications:
  enabled: true
  provider: "ntfy"
  topic_env: "NTFY_TOPIC"
